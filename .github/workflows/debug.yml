name: Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # GitHub cron runs in UTC

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Show time
        run: |
          echo "event: ${{ github.event_name }}"
          echo "UTC now:"
          date -u
          echo "Local time (Asia/Shanghai):"
          date '+%Y-%m-%d %H:%M:%S %Z'
